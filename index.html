<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MASS UP</title>
<meta name="theme-color" content="#0B1117">
<meta name="description" content="แอปส่วนตัว: เพิ่มน้ำหนักและมวลกล้ามเนื้อ 45 → 55 กก.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var th=localStorage.getItem("massup.theme");document.documentElement.setAttribute("data-theme",th==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<style>
:root{
  --bg:#F0F2F4; --surface:#FFFFFF; --raise:#F6F8FA; --ink:#0F1A24; --muted:#56636F; --line:#D8DEE4; --line-soft:#E7EBEF;
  --accent:#1B4FD8; --accent-ink:#FFFFFF; --accent-bg:#E3EBFD;
  --good:#1C7C66; --good-bg:#E1F1EC; --warn:#A86E06; --warn-bg:#FAEED6; --bad:#C0342A; --bad-bg:#FBE4E1; --rest:#6F7C89; --rest-bg:#EAEEF1;
  --heat-lo:#FFA51F; --heat-hi:#FF2E12;
  --s-bg:#0B1117; --s-surface:#131C25; --s-raise:#1A2531; --s-ink:#E9EEF3; --s-muted:#8F9DAB; --s-line:#243140;
  --hm0:#E7EBEF; --hm1:#C6E6DC; --hm2:#86CDB6; --hm3:#3FA585; --hm4:#1C7C66;
  --shadow:0 1px 2px rgba(15,26,36,.05),0 6px 20px -12px rgba(15,26,36,.18);
  --font-display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --nav-h:64px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#080C11; --surface:#111921; --raise:#162029; --ink:#E6ECF1; --muted:#8E9CAA; --line:#222E3A; --line-soft:#1A242E;
  --accent:#7DA4FF; --accent-ink:#06101F; --accent-bg:#172748;
  --good:#4FC2A4; --good-bg:#122B25; --warn:#E5AE45; --warn-bg:#2E240E; --bad:#F07466; --bad-bg:#351A17; --rest:#8E9BA8; --rest-bg:#1B252F;
  --hm0:#1A242E; --hm1:#14382F; --hm2:#1D5C4B; --hm3:#2F8F73; --hm4:#4FC2A4;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:22px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.4px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--heat-lo),var(--heat-hi));display:block}
.top .sub{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}

/* layout */
main{max-width:760px;margin:0 auto;padding:16px 16px 24px}
.view{display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card.tight{gap:8px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .right{margin-left:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.sec-title{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.3px;margin:6px 2px -4px;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--pbg,var(--accent-bg));color:var(--pc,var(--accent));white-space:nowrap}
.pill.good{--pbg:var(--good-bg);--pc:var(--good)} .pill.warn{--pbg:var(--warn-bg);--pc:var(--warn)} .pill.bad{--pbg:var(--bad-bg);--pc:var(--bad)} .pill.rest{--pbg:var(--rest-bg);--pc:var(--rest)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer;padding:10px 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink)}
.input.sm{padding:6px 8px;border-radius:9px;width:72px;text-align:center}
textarea.input{min-height:72px;resize:vertical}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bar.good>span{background:var(--good)}
.divider{height:1px;background:var(--line-soft);margin:2px 0}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px}

/* banners */
.banner{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;border:1px solid}
.banner b{font-family:var(--font-display);font-weight:600}
.banner.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--ink)}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.banner.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.banner .ico{font-size:20px;line-height:1.2}

/* hero / today */
.why{border-left:3px solid var(--heat-lo);padding:2px 0 2px 12px;font-size:15px}
.why small{display:block;color:var(--muted);font-size:12px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ring svg{width:92px;height:92px}
.ring .rv{font-family:var(--font-display);font-size:15px;font-weight:600}
.ring .rl{font-size:12px;color:var(--muted)}
.grade{font-family:var(--font-display);font-size:42px;font-weight:700;line-height:1}
.g-A{color:var(--good)} .g-B{color:var(--accent)} .g-C{color:var(--warn)} .g-D,.g-F{color:var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle .sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked+.sw{background:var(--warn)}
.toggle input:checked+.sw::after{transform:translateX(18px)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--raise);cursor:pointer;user-select:none}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px;transition:all .15s}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .body{flex:1;min-width:0}
.check .t{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.check .t time{font-family:var(--font-display);font-size:13px;color:var(--muted);font-weight:500}
.check .d{font-size:13px;color:var(--muted)}
.check .meta{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.check .meta b{display:block;font-family:var(--font-display);font-size:14px;color:var(--ink)}
.check.on{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12px;font-weight:600}
.habit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.habit:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-size:18px;line-height:1}
.stepper b{min-width:44px;text-align:center;font-family:var(--font-display)}
.cups{display:flex;gap:3px}
.cups i{width:10px;height:16px;border-radius:2px 2px 4px 4px;background:var(--line-soft);border:1px solid var(--line)}
.cups i.f{background:var(--accent);border-color:var(--accent)}

/* training */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dchip{border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;font-size:11px;background:var(--surface);cursor:pointer;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
.dchip b{font-family:var(--font-display);font-size:14px;color:var(--ink)}
.dchip.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dchip.sel{background:var(--accent-bg)}
.dchip .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dchip .dot.train{background:var(--accent)} .dchip .dot.done{background:var(--good)}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--raise)}
.ex.done{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-h h3{font-size:15px}
.exlink{cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;background:none;border:0;padding:0;font:inherit;text-align:left}
.exlink b{font-family:var(--font-display);font-size:10px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px;display:inline-block;text-decoration:none}
.target{font-size:13px;color:var(--muted)}
.hint-p{font-size:12.5px;padding:6px 10px;border-radius:10px;background:var(--accent-bg);color:var(--ink)}
.hint-p.up{background:var(--good-bg)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.set .n{font-family:var(--font-display);color:var(--muted);text-align:center;font-size:13px}
.set .unit{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.set .unit input{flex:1;min-width:0;width:100%}
.set .tick{width:40px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.set .tick.on{background:var(--good);border-color:var(--good)}
.set .tick.on::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-2px)}

/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:40;background:var(--s-bg);color:#fff;border:1px solid var(--s-line);border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.timer[hidden]{display:none}
.timer .tt{font-family:var(--font-display);font-size:22px;font-weight:700;min-width:58px;color:var(--heat-lo)}
.timer button{border:1px solid var(--s-line);background:var(--s-surface);color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tabs button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* charts / heatmap */
.chart svg{width:100%;height:auto;display:block}
.heat{overflow-x:auto;padding-bottom:4px}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;width:max-content}
.heat-grid i{width:14px;height:14px;border-radius:3px;background:var(--hm0);display:block;cursor:pointer}
.heat-grid i.l1{background:var(--hm1)} .heat-grid i.l2{background:var(--hm2)} .heat-grid i.l3{background:var(--hm3)} .heat-grid i.l4{background:var(--hm4)}
.heat-grid i.pre{visibility:hidden}
.heat-grid i.fut{background:transparent;border:1px dashed var(--line);cursor:default}
.heat-grid i.td{outline:2px solid var(--accent);outline-offset:1px}
.heat-legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.heat-legend i{width:12px;height:12px;border-radius:3px;display:block}
.weekgrades{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.weekgrades div{border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted)}
.weekgrades b{display:block;font-family:var(--font-display);font-size:18px}
.mile{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mile div{border:1px dashed var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.mile div.on{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.mile .mi{font-size:22px;filter:grayscale(1);opacity:.5}
.mile .on .mi{filter:none;opacity:1}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;aspect-ratio:3/4;background:var(--raise)}
.photos figure.sel{border-color:var(--accent)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.compare img{width:100%;border-radius:10px;display:block}

/* food */
.food-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.food{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raise);cursor:pointer;text-align:left;width:100%}
.food .fn{font-size:14px;font-weight:500}
.food .fm{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td.num,th.num{text-align:right}
.tbl{overflow-x:auto}
.extra{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.extra:last-child{border-bottom:0}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}

/* menu */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.menu button .mi{font-size:26px}
.menu button b{font-family:var(--font-display);font-size:16px}
.menu button span{font-size:12.5px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0;font-size:14px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.sheet>*{flex-shrink:0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* stamina */
.st-rail{display:grid;grid-template-columns:repeat(12,minmax(48px,1fr));gap:5px;overflow-x:auto;padding:2px 2px 6px}
.wk{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;font-size:10px;color:var(--muted)}
.wk::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.wk b{font-family:var(--font-display);font-size:16px;color:var(--ink)}
.wk[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent)}
.sday{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--raise);position:relative;overflow:hidden}
.sday::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--pc)}
.sday ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.sday .dur{font-family:var(--font-display);font-weight:600}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.mchk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none;background:var(--surface)}
.mchk.on{background:var(--good-bg);border-color:var(--good)}
.mchk.on::before{content:"✓";color:var(--good);font-weight:700}

/* ===== studio (from STAMINA 12, always dark) ===== */
.studio{background:var(--s-bg);color:var(--s-ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--s-line);--muted:var(--s-muted);--line:var(--s-line);--accent:#8FB2FF}
@media (max-width:640px){.studio{margin:0 -16px;border-radius:0;border-left:0;border-right:0}}
.studio h2{color:#fff}
.exnav{display:flex;flex-direction:column;gap:8px}
.exgrp{display:grid;grid-template-columns:1fr;gap:4px}
.exgrp>span{font-size:12px;color:var(--s-muted)}
.exrow{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.exrow::-webkit-scrollbar{display:none}
.exbtn{font-size:13px;cursor:pointer;padding:5px 12px;border-radius:999px;border:1px solid var(--s-line);background:var(--s-surface);color:var(--s-ink);white-space:nowrap}
.exbtn[aria-pressed="true"]{background:#fff;color:#0B1117;border-color:#fff;font-weight:600}
.vbody{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){.vbody{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}}
.vcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;background:radial-gradient(ellipse 85% 70% at 50% 38%,#223040 0%,#121A23 55%,#070B0F 100%);border:1px solid var(--s-line);border-radius:16px;overflow:hidden;height:420px;touch-action:pan-y}
@media (max-width:420px){.stage{height:380px}}
.stage canvas{display:block;width:100%;height:100%;cursor:grab;opacity:0;transition:opacity .5s}
.stage.ready canvas{opacity:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--s-muted);font-size:14px;pointer-events:none}
.stage.ready .loading,.stage.nogl .loading{display:none}
.ovl{position:absolute;left:14px;top:12px;pointer-events:none;display:flex;flex-direction:column;gap:6px;min-width:150px;max-width:70%}
.ovl-row{display:flex;align-items:baseline;gap:10px}
.ovl #phase{font-family:var(--font-display);font-size:18px;font-weight:600;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.ovl #count{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--heat-lo);line-height:1}
.tempo{height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.tempo i{display:block;height:100%;background:linear-gradient(90deg,var(--heat-lo),var(--heat-hi));transform-origin:0 50%;transform:scaleX(0)}
.stage .hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--s-muted);pointer-events:none}
.stage .heatbar{position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--s-muted);pointer-events:none}
.stage .heatbar i{display:block;width:80px;height:6px;border-radius:3px;background:linear-gradient(90deg,#8C4540 0%,var(--heat-lo) 42%,var(--heat-hi) 100%)}
@media (max-width:520px){.stage .hint{display:none}}
.pick{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#0B1117;border-radius:9px;padding:5px 11px;font-size:13px;line-height:1.3;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.pick.show{opacity:1}
.pick b{display:block;font-weight:600}
.pick small{color:#56636F;font-size:11px}
.fallback[hidden]{display:none}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--s-muted)}
.vctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.vgrp{display:flex;gap:6px}
.vgrp.views{order:3;flex:1 0 100%}
.vgrp.views button{flex:1}
.vctl button{font-size:13px;cursor:pointer;padding:7px 12px;border-radius:9px;border:1px solid var(--s-line);background:var(--s-surface);color:var(--s-ink)}
.vctl button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:#152238}
.vinfo{background:var(--s-surface);border:1px solid var(--s-line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.vgroup{font-size:12px;color:var(--s-muted)}
.vinfo h3{font-size:22px;color:#fff;margin-top:2px}
.vinfo .th{color:var(--s-muted);margin-top:2px}
.vsec{display:flex;flex-direction:column;gap:8px}
.vsec>b,.vsec-h b{font-family:var(--font-display);font-size:15px;font-weight:600}
.vsec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.vsec-h span{font-size:12px}
.vsec.bad>b{color:#FF8A78}
.vinfo ol,.vinfo ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.vinfo dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;border-top:1px solid var(--s-line);border-bottom:1px solid var(--s-line);padding:12px 0}
.vinfo dt{color:var(--s-muted)}
.vinfo dd{margin:0}
.meter{display:flex;flex-direction:column;gap:7px}
.mrow{display:grid;grid-template-columns:minmax(92px,auto) 1fr 30px;gap:10px;align-items:center;font-size:14px}
.mname small{display:block;font-size:11px;color:var(--s-muted);line-height:1.2}
.mbar{height:8px;border-radius:4px;background:#0A0F14;border:1px solid var(--s-line);overflow:hidden}
.mbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--heat-lo),var(--heat-hi));background-size:240px 100%;transition:width .12s linear}
.mrow.s .mbar i{background:var(--heat-lo)}
.mval{text-align:right;font-family:var(--font-display);font-weight:500;color:var(--s-muted)}
.mrow.p .mval{color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- state ---------- */
var KEY="massup.v1";
function defaults(){
  var t=todayKey();
  return {v:1,
    set:{height:167,startW:45,goalW:55,start:t,kcal:2800,protein:120,budget:150,rest:90,why:"",name:"FARM"},
    days:{},weights:[],soy:{stock:45,adj:0},shop:{},prep:{},prices:{},
    st:{start:t},st12:{on:false,week:0,checks:{}}};
}
var S;
function load(){
  var d=defaults();
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.v===1){
    for(var k in d)if(!(k in o))o[k]=d[k];
    for(k in d.set)if(!(k in o.set))o.set[k]=d.set[k];
    S=o;return;}}}catch(e){}
  S=d;
}
var saveT=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("บันทึกไม่สำเร็จ: พื้นที่เต็ม ลองสำรองแล้วลบรูปเก่า");}}
function day(k,create){var d=S.days[k];if(!d&&create){d=S.days[k]={m:{},sw:{},x:[],sl:0,wa:0,bad:0,k:{}};}return d;}
load();

/* ---------- calculations ---------- */
function targets(bad){return {kcal:bad?Math.round(S.set.kcal*.85):S.set.kcal,p:bad?100:S.set.protein};}
function mealItem(d,m){var sw=d&&d.sw&&d.sw[m.k];return sw&&FOOD[sw]?FOOD[sw]:m;}
function extraItem(x){return x.f?FOOD[x.f]:x.c;}
function nutr(k){
  var d=S.days[k],o={kcal:0,p:0,cost:0,meals:0};if(!d)return o;
  MEALS.forEach(function(m){if(d.m[m.k]){var it=mealItem(d,m);o.kcal+=it.kcal;o.p+=it.p;o.cost+=it.price||0;o.meals++;}});
  (d.x||[]).forEach(function(x){var it=extraItem(x);if(!it)return;var q=x.q||1;o.kcal+=it.kcal*q;o.p+=it.p*q;o.cost+=(it.price||0)*q;});
  return o;
}
function sessionKey(k){var d=S.days[k];if(d&&d.w&&d.w.s)return d.w.s==="rest"?null:d.w.s;return SCHED[parseKey(k).getDay()]||null;}
function sessionEx(k){var s=sessionKey(k);if(!s)return [];var d=S.days[k],bad=d&&d.bad;
  return SESS[s].ex.slice(0,bad?3:99).map(function(e){var o={};for(var p in e)o[p]=e[p];if(bad)o.sets=2;return o;});}
function workoutRatio(k){
  var s=sessionKey(k);if(!s)return null;var d=S.days[k];if(!d||!d.w)return 0;if(d.w.done)return 1;
  var tot=0,ok=0;sessionEx(k).forEach(function(e){tot+=e.sets;var a=(d.w.sets&&d.w.sets[e.id])||[];for(var i=0;i<e.sets;i++)if(a[i]&&a[i].ok)ok++;});
  return tot?ok/tot:0;
}
function dayScore(k){
  var d=S.days[k];if(!d)return 0;
  var t=targets(d.bad),n=nutr(k),sc=Math.min(n.kcal/t.kcal,1)*30+Math.min(n.p/t.p,1)*20;
  var wr=workoutRatio(k);sc+=(wr==null?1:wr)*30;sc+=d.sl?10:0;sc+=Math.min((d.wa||0)/8,1)*10;
  if(d.bad)sc=Math.min(sc,80);
  return Math.round(sc);
}
function grade(s){return s>=90?"A":s>=75?"B":s>=60?"C":s>=40?"D":"F";}
function soyUsed(){var u=0;for(var k in S.days){var d=S.days[k];if(d.m.pre&&!(d.sw&&d.sw.pre))u++;else if(d.m.pre&&d.sw&&d.sw.pre&&FOOD[d.sw.pre]&&FOOD[d.sw.pre].soy)u++;
  (d.x||[]).forEach(function(x){var it=extraItem(x);if(it&&it.soy)u+=(x.q||1);});}return u;}
function soyLeft(){return S.soy.stock+S.soy.adj-soyUsed();}
function sortedW(){return S.weights.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});}
function latestW(){var w=sortedW();return w.length?w[w.length-1].kg:S.set.startW;}
function weekAvg(mon){var end=addDays(mon,6),a=S.weights.filter(function(w){return w.d>=mon&&w.d<=end;});if(!a.length)return null;return a.reduce(function(s,w){return s+w.kg;},0)/a.length;}
function smoothMax(){var w=sortedW(),mx=0;for(var i=0;i<w.length;i++){var a=w.slice(Math.max(0,i-2),i+1);var v=a.reduce(function(s,x){return s+x.kg;},0)/a.length;if(a.length>=Math.min(3,w.length))mx=Math.max(mx,v);}return mx;}
function workoutsDone(){var n=0;for(var k in S.days){var r=workoutRatio(k);if(r!=null&&r>=.8)n++;}return n;}
function bestReps(id){var b=0;for(var k in S.days){var d=S.days[k];if(d.w&&d.w.sets&&d.w.sets[id])d.w.sets[id].forEach(function(s){if(s&&s.ok)b=Math.max(b,+s.r||0);});}return b;}
function lastSession(id,before){
  var keys=Object.keys(S.days).filter(function(k){return k<before;}).sort().reverse();
  for(var i=0;i<keys.length;i++){var d=S.days[keys[i]];if(d.w&&d.w.sets&&d.w.sets[id]){var a=d.w.sets[id].filter(function(s){return s&&s.ok;});if(a.length)return {k:keys[i],sets:a};}}
  return null;
}
function inRange(k){return k>=S.set.start&&k<=todayKey();}
function weekNo(k){return Math.floor(daysBetween(mondayOf(S.set.start),k)/7)+1;}

function itemOf(x){return x.f?FOOD[x.f]:x.c;}
function extraRow(x,i){var it=itemOf(x);if(!it)return "";var q=x.q||1;
  return '<div class="extra"><span>'+esc(it.name)+'</span><span class="row" style="flex-wrap:nowrap;gap:6px"><span class="small muted num">'+Math.round(it.kcal*q)+'</span><span class="stepper"><button data-act="qx" data-i="'+i+'" data-d="-1" aria-label="ลดจำนวน">−</button><b class="num" style="min-width:22px">'+q+'</b><button data-act="qx" data-i="'+i+'" data-d="1" aria-label="เพิ่มจำนวน">+</button></span><button class="x" data-act="rmx" data-i="'+i+'" aria-label="ลบ">×</button></span></div>';}
function logRow(label,kcal,ctrl){return '<div class="extra"><span>'+label+'</span><span class="row" style="flex-wrap:nowrap;gap:6px"><span class="small muted num">'+Math.round(kcal)+' kcal</span>'+ctrl+'</span></div>';}
function todayLog(k){var d=S.days[k];if(!d)return '<div class="empty">ยังไม่ได้บันทึกอะไรวันนี้</div>';var h="";
  MEALS.forEach(function(m){if(d.m&&d.m[m.k]){var it=mealItem(d,m);h+=logRow('🍽️ '+esc(m.name)+(d.sw&&d.sw[m.k]?' · '+esc(it.name):''),it.kcal,'<button class="x" data-act="meal" data-k="'+m.k+'" aria-label="ยกเลิกมื้อนี้">×</button>');}});
  (d.x||[]).forEach(function(x,i){h+=extraRow(x,i);});
  if(typeof DRINK!=="undefined")(d.dr||[]).forEach(function(id,i){var it=DRINK[id];if(it)h+=logRow((it.sweet?'🍬 ':'✅ ')+esc(it.name),it.kcal,'<button class="x" data-act="rmdr" data-i="'+i+'" aria-label="ลบ">×</button>');});
  if(typeof TREAT!=="undefined")(d.tr||[]).forEach(function(id,i){var it=TREAT[id];if(it)h+=logRow('🎂 '+esc(it.name),it.kcal,'<button class="x" data-act="rmtr" data-i="'+i+'" aria-label="ลบ">×</button>');});
  return h||'<div class="empty">ยังไม่ได้บันทึกอะไรวันนี้</div>';}
function weekSpend(mon){var tot=0,est=0,rows="";for(var i=0;i<7;i++){var dk=addDays(mon,i),dd=S.days[dk],lab=DOWS[parseKey(dk).getDay()]+' '+parseKey(dk).getDate(),cell,val=0;
  if(dk<S.set.start){cell='<span class="muted small">ก่อนเริ่ม</span>';}
  else if(dk>todayKey()){cell='<span class="muted">·</span>';}
  else if(dd&&dd.sp!=null){val=+dd.sp;cell=val+' ฿';}
  else{var c=Math.round(nutr(dk).cost);if(c>0){val=c;est++;cell='<span class="muted">~'+c+' ฿</span>';}else cell='<span class="muted">–</span>';}
  tot+=val;rows+='<tr><td>'+lab+'</td><td class="num">'+cell+'</td><td style="width:42%"><div class="bar"><span style="width:'+Math.min(100,val/S.set.budget*100)+'%;background:'+(val>S.set.budget?"var(--bad)":"var(--good)")+'"></span></div></td></tr>';}
  return {rows:rows,tot:tot,est:est};}

function weekStats(mon){
  var o={tr:0,meals:0,kcal:0,p:0,sl:0,wa:0,sp:0,sc:0,n:0};
  for(var i=0;i<7;i++){var k=addDays(mon,i);if(k>todayKey()||k<S.set.start)continue;o.n++;var d=S.days[k],n=nutr(k);var r=workoutRatio(k);if(r!=null&&r>=.8)o.tr++;
    if(d){if(MEALS.every(function(m){return d.m[m.k];}))o.meals++;if(d.sl)o.sl++;if((d.wa||0)>=8)o.wa++;if(d.sp!=null)o.sp+=+d.sp;}o.kcal+=n.kcal;o.p+=n.p;o.sc+=dayScore(k);}
  return o;
}
function report(){
  var mon=mondayOf(todayKey()),o=weekStats(mon),w0=weekAvg(mon),w1=weekAvg(addDays(mon,-7)),n=o.n||1;
  function best(id){var b=null;for(var i=0;i<7;i++){var d=S.days[addDays(mon,i)];if(d&&d.w&&d.w.sets&&d.w.sets[id])d.w.sets[id].forEach(function(s){if(s&&s.ok&&(!b||(+s.kg||0)>(+b.kg||0)||((+s.kg||0)===(+b.kg||0)&&(+s.r||0)>(+b.r||0))))b=s;});}return b?((b.kg?b.kg+" กก. × ":"")+b.r):"–";}
  return "📊 MASS UP รายงานสัปดาห์ "+fmtDate(mon)+" – "+fmtDate(addDays(mon,6))+"\n"+
    "น้ำหนักเฉลี่ย: "+(w0!=null?r1(w0)+" กก.":"ยังไม่ได้ชั่ง")+(w0!=null&&w1!=null?" ("+(w0-w1>=0?"+":"")+r1(w0-w1)+" จากสัปดาห์ก่อน)":"")+"\n"+
    "เทรน: "+o.tr+"/4 ครั้ง\n"+
    "กินครบ 5 มื้อ: "+o.meals+"/"+o.n+" วัน · เฉลี่ย "+fmtN(o.kcal/n)+" kcal / โปรตีน "+Math.round(o.p/n)+" ก.\n"+
    "นอนครบ 7 ชม.: "+o.sl+"/"+o.n+" · น้ำ 8 แก้ว: "+o.wa+"/"+o.n+"\n"+
    "ใช้เงิน: "+fmtN(o.sp)+" ฿ (งบ "+fmtN(S.set.budget*7)+")\n"+
    "คะแนนเฉลี่ย: "+grade(o.sc/n)+" ("+Math.round(o.sc/n)+")\n"+
    "ท่าหลัก (ดีที่สุด): Bench "+best("dbpress")+" · Pulldown "+best("pulldown")+" · Split squat "+best("split")+" · Lateral raise "+best("latraise")+" · Push-up "+best("pushup")+"\n"+
    "Mass Soy เหลือ: "+Math.max(0,soyLeft())+" ครั้ง\n"+
    "หมายเหตุ: ";
}

/* ---------- photos: IndexedDB ---------- */
var idb=null;
function idbOpen(cb){if(idb)return cb(idb);try{var r=indexedDB.open("massup",1);r.onupgradeneeded=function(){r.result.createObjectStore("photos",{keyPath:"id",autoIncrement:true});};r.onsuccess=function(){idb=r.result;cb(idb);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function idbAll(cb){idbOpen(function(db){if(!db)return cb([]);var out=[],tx=db.transaction("photos","readonly");tx.objectStore("photos").openCursor().onsuccess=function(e){var c=e.target.result;if(c){out.push(c.value);c.continue();}else cb(out);};});}
function idbPut(v,cb){idbOpen(function(db){if(!db)return cb&&cb();var tx=db.transaction("photos","readwrite");tx.objectStore("photos").put(v);tx.oncomplete=function(){cb&&cb();};});}
function idbDel(id,cb){idbOpen(function(db){if(!db)return cb&&cb();var tx=db.transaction("photos","readwrite");tx.objectStore("photos").delete(id);tx.oncomplete=function(){cb&&cb();};});}
function idbClear(cb){idbOpen(function(db){if(!db)return cb&&cb();var tx=db.transaction("photos","readwrite");tx.objectStore("photos").clear();tx.oncomplete=function(){cb&&cb();};});}
var photoCache=[];
function loadPhotos(){idbAll(function(list){photoCache=list.sort(function(a,b){return a.d<b.d?1:-1;});photoCount=list.length;var el=$("photos");if(!el)return;
  if(!list.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">ยังไม่มีรูป เริ่มจากรูปวันที่ 0 วันนี้เลย</div>';}
  else el.innerHTML=list.map(function(p){return '<figure class="'+(photoSel.indexOf(p.id)>=0?"sel":"")+'" data-act="selPhoto" data-id="'+p.id+'"><img src="'+p.data+'" alt="รูป '+fmtDate(p.d)+'" loading="lazy"><figcaption>'+fmtDate(p.d)+(p.kg?" · "+p.kg+" กก.":"")+'</figcaption></figure>';}).join("");
  var due=$("photoDue");if(due&&list.length){var nx=addDays(list[0].d,28),dl=daysBetween(todayKey(),nx);due.innerHTML='รูปล่าสุด '+fmtDate(list[0].d)+' · รอบถัดไป <b>'+fmtDate(nx)+'</b>'+(dl<=0?' <span class="pill warn">ถึงเวลาถ่ายแล้ว</span>':' (อีก '+dl+' วัน)')+' · เลือก 2 รูปเพื่อเทียบ · รูปเก็บในเครื่องนี้เท่านั้น';}
  var cb=$("cmpBtn");if(cb)cb.style.display=photoSel.length===2?"":"none";
});}
function addPhotoFile(file){
  var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){
    var mx=900,s=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);var data=c.toDataURL("image/jpeg",.78);
    idbPut({d:todayKey(),kg:r1(latestW()),data:data},function(){toast("เก็บรูปแล้ว 📸");if(view==="progress")renderProgress();});
  };img.src=fr.result;};fr.readAsDataURL(file);
}

/* ---------- rest timer ---------- */
var timer={end:0,iv:0},actx=null;
function beep(){try{if(!actx)return;var t=actx.currentTime;[0,.28,.56].forEach(function(o){var os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.3,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.22);os.start(t+o);os.stop(t+o+.24);});}catch(e){}}
function unlockAudio(){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(actx&&actx.state==="suspended")actx.resume();}catch(e){}}
function startTimer(sec){timer.end=Date.now()+sec*1000;$("timer").hidden=false;clearInterval(timer.iv);timer.iv=setInterval(tickTimer,250);tickTimer();}
function tickTimer(){var left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));$("timerT").textContent=Math.floor(left/60)+":"+pad(left%60);
  if(left<=0){clearInterval(timer.iv);beep();try{navigator.vibrate&&navigator.vibrate([250,120,250]);}catch(e){}toast("หมดเวลาพัก · เซตต่อไป 💪");setTimeout(function(){$("timer").hidden=true;},1500);}}

      bBack.quaternion.setFromUnitVectors(Yax,vUp);
    }
  }
  function placeTower(){
    var p=Wp("pelvis"),hl=Wp("handL"),hr=Wp("handR"),zf=p.z+.95,top=2.3,zp=p.z+.12;
    tPost.scale.set(.07,top,.07);tPost.position.set(0,top/2,zf);
    tArm.scale.set(.06,.06,zf-zp+.08);tArm.position.set(0,top,(zf+zp)/2);
    tBase.scale.set(.6,.05,.08);tBase.position.set(0,.025,zf);
    tHorn.position.set(0,.42,zf-.16);tHorn.rotation.x=Math.PI/2;
    tPlate.position.set(0,.42,zf-.1);tPlate.rotation.x=Math.PI/2;tPlate2.position.set(0,.42,zf-.165);tPlate2.rotation.x=Math.PI/2;
    pulley.position.set(0,top-.08,zp);
    stretch(bar,hl,hr,.34);
    va.addVectors(hl,hr).multiplyScalar(.5);vb.set(0,top-.08,zp);stretch(cable,va,vb,0);
  }

  // ---- tap a muscle to name it (CPU-skinned ray test, only on tap) ----
  var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),skinned=null,pickTimer=0;
  function pick(cx,cy){
    if(!ready)return;
    var rc=cv.getBoundingClientRect();ndc.set((cx-rc.left)/rc.width*2-1,-(cy-rc.top)/rc.height*2+1);
    ray.setFromCamera(ndc,camera);
    var g=R.mesh.geometry,pos=g.attributes.position.array,si=g.attributes.skinIndex.array,sw=g.attributes.skinWeight.array,ix=g.index.array,n=R.nV,i,c;
    R.mesh.skeleton.update();var bm=R.mesh.skeleton.boneMatrices;
    if(!skinned)skinned=new Float32Array(n*3);
    for(i=0;i<n;i++){var x=pos[i*3],y=pos[i*3+1],z=pos[i*3+2],ox=0,oy=0,oz=0;
      for(c=0;c<4;c++){var w=sw[i*4+c];if(!w)continue;var o=si[i*4+c]*16;
        ox+=w*(bm[o]*x+bm[o+4]*y+bm[o+8]*z+bm[o+12]);oy+=w*(bm[o+1]*x+bm[o+5]*y+bm[o+9]*z+bm[o+13]);oz+=w*(bm[o+2]*x+bm[o+6]*y+bm[o+10]*z+bm[o+14]);}
      skinned[i*3]=ox;skinned[i*3+1]=oy;skinned[i*3+2]=oz;}
    var O=ray.ray.origin,Dr=ray.ray.direction,best=1e9,hit=-1;
    for(i=0;i<ix.length;i+=3){
      var a=ix[i]*3,b=ix[i+1]*3,d=ix[i+2]*3;
      var e1x=skinned[b]-skinned[a],e1y=skinned[b+1]-skinned[a+1],e1z=skinned[b+2]-skinned[a+2],
          e2x=skinned[d]-skinned[a],e2y=skinned[d+1]-skinned[a+1],e2z=skinned[d+2]-skinned[a+2];
      var px=Dr.y*e2z-Dr.z*e2y,py=Dr.z*e2x-Dr.x*e2z,pz=Dr.x*e2y-Dr.y*e2x,det=e1x*px+e1y*py+e1z*pz;
      if(det<1e-12)continue;
      var tx=O.x-skinned[a],ty=O.y-skinned[a+1],tz=O.z-skinned[a+2],u=(tx*px+ty*py+tz*pz)/det;if(u<0||u>1)continue;
      var qx=ty*e1z-tz*e1y,qy=tz*e1x-tx*e1z,qz=tx*e1y-ty*e1x,v=(Dr.x*qx+Dr.y*qy+Dr.z*qz)/det;if(v<0||u+v>1)continue;
      var tt=(e2x*qx+e2y*qy+e2z*qz)/det;if(tt>0&&tt<best){best=tt;hit=u+v<.34?ix[i]:u>v?ix[i+1]:ix[i+2];}
    }
    var el=$("pick");if(hit<0){el.classList.remove("show");return;}
    var grp=RIG.groupAt(R,hit);if(!grp){el.classList.remove("show");return;}
    var nm=NAMES[baseOf(grp)]||[grp,""],sd=sideOf(grp);
    el.innerHTML="<b>"+nm[0]+(sd?(sd==="L"?" ซ้าย":" ขวา"):"")+"</b><small>"+nm[1]+"</small>";
    el.style.left=Math.max(70,Math.min(rc.width-70,cx-rc.left))+"px";el.style.top=Math.max(54,cy-rc.top-14)+"px";el.classList.add("show");
    flash.g=grp;flash.t=1.6;clearTimeout(pickTimer);pickTimer=setTimeout(function(){el.classList.remove("show");},2600);
    if(!playing)draw(.016);
  }

  // ---- resize & loop ----
  var stage=$("stage"),cv=$("cv");
  function resize(){var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(ready&&cur){frame(cur);cam.dist=want.dist;}draw(0);}
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener("resize",resize);
  if(window.IntersectionObserver)new IntersectionObserver(function(es){visible=es[0].isIntersecting;}).observe(stage);
  var last=performance.now();
  function loop(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    if(ready&&visible&&!document.hidden){if(playing)t+=dt*speed;draw(dt);}
    requestAnimationFrame(loop);
  }

  // ---- controls ----
  function syncPlay(){$("vPlay").textContent=playing?"หยุด":"เล่น";$("vPlay").setAttribute("aria-pressed",playing?"false":"true");}
  $("vPlay").addEventListener("click",function(){playing=!playing;syncPlay();});
  $("vSlow").addEventListener("click",function(){speed=speed===1?.5:1;this.setAttribute("aria-pressed",speed<1?"true":"false");});
  $("vSpin").addEventListener("click",function(){spin=!spin;this.setAttribute("aria-pressed",spin?"true":"false");if(spin)clearView();});
  $("vAnat").addEventListener("click",function(){var on=U.uMode.value<.5;U.uMode.value=on?1:0;this.setAttribute("aria-pressed",on?"true":"false");stage.classList.toggle("clay",!on);if(!playing)draw(0);});
  document.querySelectorAll(".vctl [data-view]").forEach(function(b){b.addEventListener("click",function(){setView(b.dataset.view);});});
  syncPlay();

  // drag to orbit (horizontal on touch so the page still scrolls), wheel to zoom, tap to identify
  var drag=null;
  cv.addEventListener("pointerdown",function(e){drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,moved:0,touch:e.pointerType==="touch"};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener("pointermove",function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
    drag.moved=Math.max(drag.moved,Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0));if(drag.moved<5)return;
    cam.az-=dx*.01;spin=false;$("vSpin").setAttribute("aria-pressed","false");clearView();
    if(!drag.touch)cam.el=Math.max(-.05,Math.min(1.35,cam.el+dy*.008));});
  cv.addEventListener("pointerup",function(e){if(drag&&drag.moved<5)pick(e.clientX,e.clientY);drag=null;});
  ["pointercancel","pointerleave"].forEach(function(n){cv.addEventListener(n,function(){drag=null;});});
  cv.addEventListener("wheel",function(e){e.preventDefault();want.dist=Math.max(1.6,Math.min(7,want.dist*(1+e.deltaY*.001)));},{passive:false});

  // ---- grow the model lazily: only the first time the studio is shown ----
  var started=false;
  function start(){
    if(started)return;started=true;
    setTimeout(function(){
      var lowMem=navigator.deviceMemory&&navigator.deviceMemory<4;
      R=RIG.build(M,{cell:lowMem?.009:.0075});
      scene.add(R.root);scene.add(R.mesh);R.props.pf.renderOrder=10;
      ready=true;stage.classList.add("ready");
      open(cur?cur.id:"dbpress",false);resize();
      requestAnimationFrame(function(n){last=n;loop(n);});
    },60);
  }
  open("dbpress",false);
  window.MU_STUDIO={open:function(id){start();open(id,false);},show:function(){start();setTimeout(resize,30);}};
})();

</script>
